<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Artigo — TechLrx</title>

  <meta
    name="description"
    content="Artigo do TechLrx"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div
    class="progress-bar"
    id="progress"
  ></div>


  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >

        <span class="logo-symbol">
          ✦
        </span>

        <span>
          Tech<span>Nexo</span>
        </span>

      </a>


      <nav id="nav">

        <a href="index.html">
          Início
        </a>

        <a href="index.html#artigos">
          Artigos
        </a>

        <a href="index.html#sobre">
          Sobre
        </a>

      </nav>


      <div class="header-actions">

        <button
          class="icon-button"
          id="themeBtn"
        >
          ☾
        </button>

        <button
          class="menu-button"
          id="menuBtn"
        >
          ☰
        </button>

      </div>

    </div>

  </header>


  <!-- ARTIGO -->

  <main>

    <article
      class="article-page"
      id="article"
    >

      <a
        href="index.html"
        class="back-link"
      >
        ← Voltar para artigos
      </a>


      <div
        class="article-category"
        id="articleCategory"
      ></div>


      <h1 id="articleTitle"></h1>


      <p
        class="article-description"
        id="articleDescription"
      ></p>


      <div class="article-meta">

        <span id="articleDate"></span>

      </div>


      <!-- BOTÕES -->

      <div class="article-actions">

        <button
          class="action-button"
          id="likeBtn"
        >

          <span id="likeIcon">
            ♡
          </span>

          <span id="likeText">
            Curtir
          </span>

          <span id="likeCount">
            0
          </span>

        </button>


        <button
          class="action-button"
          id="shareBtn"
        >
          ↗ Compartilhar
        </button>


        <button
          class="action-button"
          id="copyBtn"
        >
          ⧉ Copiar link
        </button>

      </div>


      <!-- CAPA DO ARTIGO -->

      <div
        class="article-cover"
        id="articleCover"
      >

        <img
          id="articleCoverImage"
          src=""
          alt=""
        >

      </div>


      <!-- TEXTO -->

      <div
        class="article-content"
        id="articleContent"
      ></div>


      <!-- RELACIONADOS -->

      <div class="related">

        <div class="section-heading small-heading">

          <div>

            <span class="section-label">
              CONTINUE LENDO
            </span>

            <h2>
              Você também pode gostar
            </h2>

          </div>

        </div>


        <div
          class="related-grid"
          id="related"
        ></div>

      </div>

    </article>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-inner">

      <a
        href="index.html"
        class="logo"
      >

        <span class="logo-symbol">
          ✦
        </span>

        <span>
          Tech<span>Nexo</span>
        </span>

      </a>


      <p>
        © 2026 TechLrx. Conteúdo independente.
      </p>

    </div>

  </footer>


  <button
    class="top-button"
    id="topBtn"
  >
    ↑
  </button>


  <script src="script.js"></script>

</body>
</html>
